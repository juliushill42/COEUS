apiVersion: v1
kind: Namespace
metadata:
  name: coeus

---
# ── Scheduler ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coeus-scheduler
  namespace: coeus
  labels:
    app: coeus-scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coeus-scheduler
  template:
    metadata:
      labels:
        app: coeus-scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: scheduler
          image: titanuai/coeus-scheduler:latest
          ports:
            - containerPort: 8080
          env:
            - name: COEUS_SCHEDULER_PORT
              value: "8080"
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: coeus-scheduler
  namespace: coeus
spec:
  selector:
    app: coeus-scheduler
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP

---
# ── Telemetry ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coeus-telemetry
  namespace: coeus
  labels:
    app: coeus-telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coeus-telemetry
  template:
    metadata:
      labels:
        app: coeus-telemetry
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: telemetry
          image: titanuai/coeus-telemetry:latest
          ports:
            - containerPort: 8081
          env:
            - name: COEUS_TELEMETRY_PORT
              value: "8081"
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: coeus-telemetry
  namespace: coeus
spec:
  selector:
    app: coeus-telemetry
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP

---
# ── KV Router ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coeus-router
  namespace: coeus
  labels:
    app: coeus-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coeus-router
  template:
    metadata:
      labels:
        app: coeus-router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: router
          image: titanuai/coeus-router:latest
          ports:
            - containerPort: 8082
          env:
            - name: COEUS_ROUTER_PORT
              value: "8082"
            - name: COEUS_EVICTION_POLICY
              value: "sla"
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: coeus-router
  namespace: coeus
spec:
  selector:
    app: coeus-router
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP

---
# ── Dashboard ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coeus-dashboard
  namespace: coeus
  labels:
    app: coeus-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coeus-dashboard
  template:
    metadata:
      labels:
        app: coeus-dashboard
    spec:
      containers:
        - name: dashboard
          image: titanuai/coeus-dashboard:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: coeus-dashboard
  namespace: coeus
spec:
  selector:
    app: coeus-dashboard
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer

---
# ── HPA for scheduler ───────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coeus-scheduler-hpa
  namespace: coeus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coeus-scheduler
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
